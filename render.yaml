services:
  - type: web
    name: digital-alpha-api
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: digital-alpha-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: BACKEND_API_URL
        sync: false
